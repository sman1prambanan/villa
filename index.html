<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    color:#333;
}

.container{
    max-width:500px;
    padding:40px;
}

.icon{
    font-size:70px;
    margin-bottom:20px;
}

h1{
    font-size:36px;
    margin-bottom:15px;
}

p{
    color:#666;
    line-height:1.7;
    margin-bottom:10px;
}

.time{
    display:inline-block;
    margin-top:25px;
    padding:12px 22px;
    background:#f4f4f4;
    border-radius:10px;
    font-weight:bold;
    color:#111;
}

.footer{
    margin-top:40px;
    font-size:13px;
    color:#999;
}
</style>

</head>
<body>

<div class="container">

<div class="icon">🛠️</div>

<h1>Sedang Maintenance</h1>

<p>
Mohon maaf, website sedang dalam proses perbaikan, Sementara ini web akan ditutup sementara
</p>

<p>
Website akan kembali dibuka jika maintenance sudah selesai
</p>

<div class="time">
WEBSITE DI TUTUP
</div>

<div class="footer">

</div>

</div>

</html>
