<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    color:#333;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    max-width:600px;
    padding:30px;
}

.icon{
    font-size:60px;
    margin-bottom:20px;
}

h1{
    font-size:32px;
    margin-bottom:15px;
}

p{
    font-size:16px;
    line-height:1.8;
    color:#666;
}

.countdown{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
    color:#000;
}

.footer{
    margin-top:20px;
    font-size:14px;
    color:#888;
}
</style>
</head>
<body>

<div class="container">

<div class="icon">🚧</div>

<h1>Website Sedang Dalam Maintenance</h1>

<p>
Mohon maaf atas ketidaknyamanannya.<br>
Website sedang dalam proses pemeliharaan dan peningkatan sistem.
</p>

<div class="countdown" id="countdown">
Menghitung waktu...
</div>

<div class="footer">
Website akan kembali online pada<br>
<b>Rabu, 8 Juli 2026 pukul 10.00 WIB</b>
</div>

</div>

<script>
const target = new Date("2026-07-08T10:00:00+07:00").getTime();

function updateCountdown(){
    const now = new Date().getTime();
    const distance = target - now;

    if(distance <= 0){
        document.body.innerHTML = `
            <div style="text-align:center;font-family:Arial,sans-serif;">
                <h1>✅ Website Telah Dibuka</h1>
                <p>Maintenance telah selesai.</p>
            </div>
        `;
        return;
    }

    const hari = Math.floor(distance / (1000*60*60*24));
    const jam = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
    const menit = Math.floor((distance % (1000*60*60)) / (1000*60));
    const detik = Math.floor((distance % (1000*60)) / 1000);

    document.getElementById("countdown").innerHTML =
        `${hari} Hari ${jam} Jam ${menit} Menit ${detik} Detik`;
}

updateCountdown();
setInterval(updateCountdown,1000);
</script>

</body>
</html>
